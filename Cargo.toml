[package]
name = "comdirect-postbox-rs"
version = "0.4.0"
edition = "2024"
description = "Deutsche TUI zum inkrementellen Archivieren der comdirect Postbox"
license = "GPL-3.0-or-later"
repository = "https://github.com/BBMBB/comdirect-postbox-rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.28"
directories = "6.0"
filetime = "0.2"
fs2 = "0.4"
ratatui = "0.29"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.27"
uuid = { version = "1.0", features = ["v4"] }
walkdir = "2.5"
zeroize = { version = "1.8", features = ["derive"] }

[profile.release]
lto = "thin"
strip = true
